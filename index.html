/* ===== Animazioni, suoni, annulla, cronologia ===== */
let FX=[],MOVA=new Map(),FLASH=new Map(),UNDOS=[];
const NOW=()=>(typeof performance!="undefined"?performance.now():Date.now());
const fxOn=()=>!!CTX&&!SIM;
function fxAdd(o){if(!fxOn())return;o.t0=NOW();FX.push(o);if(FX.length>60)FX.shift()}
/* --- suoni --- */
let SND={on:true,ctx:null};try{SND.on=localStorage.getItem("mitoSnd")!=="0"}catch(e){}
function sndCtx(){if(!SND.ctx){try{const C=window.AudioContext||window.webkitAudioContext;if(C)SND.ctx=new C()}catch(e){}}if(SND.ctx&&SND.ctx.state=="suspended")try{SND.ctx.resume()}catch(e){}return SND.ctx}
function tone(f,d,ty,v,f2,dl){const c=SND.ctx;if(!c)return;const t=c.currentTime+(dl||0),o=c.createOscillator(),g=c.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.06,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v,fq,dl){const c=SND.ctx;if(!c)return;const t=c.currentTime+(dl||0),n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();f.type="lowpass";f.frequency.value=fq||900;g.gain.value=v||.08;s.buffer=b;s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)}
function sfx(k){if(!SND.on||SIM||!SND.ctx||(typeof tut!="undefined"&&false))return;try{({
 sel:()=>tone(660,.05,"triangle",.025),
 move:()=>{tone(420,.09,"triangle",.05,300);noise(.05,.03,1200)},
 hit:()=>{noise(.12,.11,700);tone(150,.14,"sine",.07,80)},
 block:()=>{tone(1047,.25,"sine",.05);tone(1568,.3,"sine",.035,0,.03)},
 death:()=>{tone(330,.45,"sawtooth",.035,70);noise(.25,.05,500,.05)},
 pick:()=>{[784,988,1319].forEach((f,i)=>tone(f,.18,"sine",.045,0,i*.07))},
 ab:()=>{tone(392,.3,"triangle",.05,880);noise(.25,.04,2500)},
 turn:()=>{tone(523,.22,"sine",.035);tone(784,.3,"sine",.03,0,.08)},
 undo:()=>tone(500,.12,"triangle",.04,350),
 win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.35,"triangle",.06,0,i*.13))},
 gain:()=>tone(880,.12,"sine",.03,1100)}[k]||(()=>{}))()}catch(e){}}
function sndToggle(){SND.on=!SND.on;try{localStorage.setItem("mitoSnd",SND.on?"1":"0")}catch(e){}sndCtx();if(SND.on)sfx("sel");const b=el("snBtn");if(b)b.textContent=SND.on?"🔊":"🔇"}
try{window.addEventListener("pointerdown",()=>{if(SND.on)sndCtx()},{capture:true})}catch(e){}
/* --- agganci al motore --- */
const humanTurn=()=>!(ai&&turn==aiP)&&!(typeof TBUSY!="undefined"&&TBUSY);
const _fxMv=mvTo;mvTo=function(q,r,c){const r0=q.r,c0=q.c;
 if(!SIM&&CTX&&humanTurn()&&!over&&typeof glSnap=="function"){try{UNDOS.push({S:glSnap(),tc,turn,L:(typeof LOG!="undefined"&&LOG&&LOG.e)?LOG.e.length:-1})}catch(e){}}
 const mb=MA.filter(m=>!m.done).length,res=_fxMv(q,r,c);
 if(fxOn()){MOVA.set(q,{r0,c0,t0:NOW(),fly:q.t=="P"});sfx("move");if(MA.filter(m=>!m.done).length<mb){fxAdd({k:"pick",r,c,col:MA.find(m=>m.r==r&&m.c==c&&m.k=="s")?"#ffd23a":"#6aff9a",d:900});setTimeout(()=>sfx("pick"),120)}}
 return res};
const _fxHit=hit;hit=function(x,d,by){const r=x.r,c=x.c,h0=x.hp;const n=_fxHit(x,d,by);
 if(fxOn()){if(n<0){fxAdd({k:"txt",r,c,s:"Parato!",col:"#ffd23a",d:1100});fxAdd({k:"ring",r,c,col:"#ffd23a",d:600});sfx("block")}
  else{fxAdd({k:"txt",r,c,s:"−"+n,col:"#ff5a4a",d:1000});FLASH.set(x,NOW());sfx("hit");
   if(x.hp<=0&&h0>0){fxAdd({k:"die",r,c,t:x.t,p:x.p,d:750});setTimeout(()=>sfx("death"),90)}}}
 return n};
const _fxAtk=attack;attack=function(q,x){if(!SIM)UNDOS=[];if(fxOn())fxAdd({k:"lunge",q,tr:x?x.r:q.r,tc2:x?x.c:q.c,d:260});return _fxAtk(q,x)};
const _fxEv=eventLog;eventLog=function(t){_fxEv(t);if(SIM)return;if(/usa la sua abilit|blocca \d|sbarra/.test(t)){UNDOS=[];const k=Object.keys(CH).find(z=>t.startsWith(CH[z].n));const q=k&&has(turn,k);if(fxOn()&&q){fxAdd({k:"ring",r:q.r,c:q.c,col:"#ff9a3a",d:800,big:1});sfx("ab")}}
 if(/ rinasce$/.test(t)&&fxOn()){const k=Object.keys(CH).find(z=>t.startsWith(CH[z].n));const q=k&&has(turn,k);if(q)fxAdd({k:"ring",r:q.r,c:q.c,col:"#9cffd0",d:900,big:1})}};
const _fxST=startTurn;startTurn=function(p){const m0=mana[p],i0=imp[p];const res=_fxST(p);const dm=mana[p]-m0,di=imp[p]-i0;
 if(!SIM&&(dm>0||di>0)){eventLog("Guadagna "+(dm>0?"+"+dm+" ⚡":"")+(dm>0&&di>0?" e ":"")+(di>0?"+"+di+" 🔥":""));if(fxOn()){fxAdd({k:"gain",p,s:(dm>0?"+"+dm+" ⚡  ":"")+(di>0?"+"+di+" 🔥":""),d:1500});setTimeout(()=>sfx("gain"),350)}}
 return res};
const _fxET=endTurn;endTurn=function(){UNDOS=[];const r=_fxET();if(fxOn()&&!over){fxAdd({k:"ban",s:"Tocca alla squadra "+(turn==1?"Blu":"Rossa"),p:turn,d:1100});sfx("turn")}return r};
const _fxWin=win;win=function(p,w){const r=_fxWin(p,w);if(fxOn()&&p){fxAdd({k:"ban",s:"Vince la squadra "+(p==1?"Blu":"Rossa")+"!",p,d:2600});const a=ART[p==1?2:1];fxAdd({k:"ring",r:a[0],c:a[1],col:"#ffd23a",d:1400,big:2});sfx("win")}return r};
function undoMv(){if(over||!UNDOS.length||!humanTurn())return;const u=UNDOS.pop();if(u.tc!==tc||u.turn!==turn){UNDOS=[];draw();return}
 glRest(u.S);PRV=null;MOVA.clear();if(typeof LOG!="undefined"&&LOG&&u.L>=0){LOG.e.length=u.L;LOG.e.push("T"+(Math.floor(tc/2)+1)+" "+(turn==1?"B":"N")+" "+glWho(turn)+" U annulla l’ultima mossa")}sfx("undo");draw()}
/* --- disegno effetti --- */
const ease=k=>1-Math.pow(1-k,3);
function pieceOff(q,cs,now){const a=MOVA.get(q);if(!a)return null;const k=(now-a.t0)/280;if(k>=1){MOVA.delete(q);return null}const[x0,y0]=cellXY(a.r0,a.c0),[x1,y1]=cellXY(q.r,q.c),e=ease(k);return{dx:(x0-x1)*(1-e),dy:(y0-y1)*(1-e)-(a.fly?Math.sin(Math.PI*k)*cs*.6:0),sc:a.fly?1+Math.sin(Math.PI*k)*.18:1}}
function drawFX(x,cs,now){FX=FX.filter(f=>now-f.t0<f.d);
 for(const f of FX){const k=(now-f.t0)/f.d;
  if(f.k=="txt"){const[px,py]=cellXY(f.r,f.c);x.globalAlpha=Math.min(1,2.2*(1-k));x.font="bold "+Math.round(cs*.52)+"px Georgia,serif";x.textAlign="center";x.textBaseline="middle";const y=py+cs*.2-k*cs*.8;x.lineWidth=Math.max(3,cs*.1);x.strokeStyle="#1a0a04";x.strokeText(f.s,px+cs/2,y);x.fillStyle=f.col;x.fillText(f.s,px+cs/2,y)}
  else if(f.k=="ring"){const[px,py]=cellXY(f.r,f.c);x.globalAlpha=1-k;x.lineWidth=Math.max(2,cs*.1)*(1-k*.5);x.strokeStyle=f.col;x.beginPath();x.arc(px+cs/2,py+cs/2,cs*(.45+k*(f.big?.6*f.big:.35)),0,7);x.stroke()}
  else if(f.k=="pick"){const[px,py]=cellXY(f.r,f.c),cx=px+cs/2,cy=py+cs/2;x.globalAlpha=1-k;x.fillStyle=f.col;for(let i=0;i<10;i++){const a=i/10*6.283+k*2,R=cs*(.2+k*.9);x.beginPath();x.arc(cx+Math.cos(a)*R,cy+Math.sin(a)*R,cs*.07*(1-k)+1,0,7);x.fill()}}
  else if(f.k=="die"){const[px,py]=cellXY(f.r,f.c),cx=px+cs/2,cy=py+cs/2,R=cs*.43*(1-k*.6);x.globalAlpha=(1-k)*.9;x.fillStyle=f.p==1?"#2a74d6":"#8a1c4c";x.beginPath();x.arc(cx,cy-k*cs*.3,R,0,7);x.fill();
   const im=tokImg(f.t);if(im.complete&&im.naturalWidth){x.save();x.beginPath();x.arc(cx,cy-k*cs*.3,R*.86,0,7);x.clip();x.filter="grayscale(1)";x.drawImage(im,cx-R*.86,cy-k*cs*.3-R*.86,R*1.72,R*1.72);x.restore()}
   x.fillStyle="#ffffffaa";for(let i=0;i<8;i++){const a=i/8*6.283,D=cs*(.3+k*.5);x.beginPath();x.arc(cx+Math.cos(a)*D,cy+Math.sin(a)*D,cs*.05*(1-k)+.5,0,7);x.fill()}}
  else if(f.k=="gain"){const by=f.p==(flip()?2:1)?LAY.by+13*cs-cs*.6:LAY.by+cs*.6;x.globalAlpha=Math.min(1,3*(1-k));x.font="bold "+Math.round(cs*.55)+"px Georgia,serif";x.textAlign="center";x.textBaseline="middle";const y=by-(f.p==(flip()?2:1)?1:-1)*k*cs*.6;x.lineWidth=4;x.strokeStyle="#1a0a04";x.strokeText(f.s,LAY.bx+4.5*cs,y);x.fillStyle="#ffe08a";x.fillText(f.s,LAY.bx+4.5*cs,y)}
  else if(f.k=="ban"){const a=k<.15?k/.15:k>.75?(1-k)/.25:1;x.globalAlpha=Math.max(0,a);const w=9*cs,h=cs*1.15,y=LAY.by+6.5*cs-h/2;x.fillStyle="#170e09e6";x.fillRect(LAY.bx,y,w,h);x.fillStyle=f.p==1?"#4aa8ff":"#ff4b4b";x.fillRect(LAY.bx,y,w,3);x.fillRect(LAY.bx,y+h-3,w,3);
   x.font="bold "+Math.round(cs*.5)+"px Georgia,serif";x.textAlign="center";x.textBaseline="middle";x.fillStyle="#ffe9b8";x.fillText(f.s,LAY.bx+w/2,y+h/2)}}
 x.globalAlpha=1}
