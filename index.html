 e.innerHTML=h;e.querySelectorAll(".lr").forEach(r=>{const k=r.dataset.k;lpress(r,()=>tip(k,pcs(p).find(z=>z.t==k)))})}

 if(!R||!tiles.length)return;
 const tg=targets(),tset=new Set(tg.map(t=>t[0]+","+t[1])),sq=SQ.map(z=>{let m=[0,0,0];for(let r=5;r<=7;r++)for(let c=z[0];c<=z[1];c++){const q=bd[r][c];if(q)m[q.p]++}
  return m[1]&&!m[2]?0x3a5fd0:m[2]&&!m[1]?0x9a3a6a:z[2]==2?0x7a55e8:0x5a45b8});
 selG=null;
 tiles.forEach(t=>{const r=t.r,c=t.c,q=bd[r][c],k=(r+c)%2;let col=k?0x2e2b55:0x27244a;
  if(r<=4)col=k?0x473f54:0x413a4a;else if(r>=8)col=k?0x473159:0x412c52;

  if(sel&&sel.r==r&&sel.c==c)col=0x9cffd0;
  t.m.material.color.setHex(col)});
 while(pieceG.children.length)pieceG.remove(pieceG.children[0]);while(maG.children.length)maG.remove(maG.children[0]);
 MA.forEach(m=>{if(!m.done)maG.add(crystal(m.c-4,6-m.r,m.k=="s"?0x7ff0ff:0x6aff9a,m.p==1?0x1a3a90:0x901a2a,.7))});
 bd.forEach(rw=>rw.forEach(q=>{if(!q)return;const g=new THREE.Group();g.position.set(q.c-4,0,6-q.r);g.userData.cell=[q.r,q.c];
  const sh=new THREE.Mesh(cy(.34,.34,.02,16),BC.sh||(BC.sh=new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:.35})));sh.position.y=.02;g.add(sh);
  const bb=new THREE.Group();bb.position.y=.7;bb.quaternion.copy(camera.quaternion);g.add(bb);
  const rc=q.sh?0x7ff0ff:q.sl>0?0xa070ff:q.fz>0?0xff5050:q.p==1?0x4aa8ff:0xff4b4b;
  bb.add(new THREE.Mesh(geo("rg",()=>new THREE.RingGeometry(.43,.51,28)),bm(rc)));
  const coin=new THREE.Mesh(geo("ci",()=>new THREE.CircleGeometry(.43,28)),tokMat(q.t,q.p));coin.position.z=.002;bb.add(coin);
  [[atk(q),"#1e6fd9",-.36],[q.hp,"#c0392b",.36]].forEach(z=>{const m=new THREE.Mesh(geo("pl2",()=>new THREE.PlaneGeometry(.4,.4)),badgeMat(z[0],z[1]));m.position.set(z[2],-.42,.01);bb.add(m)});
  pieceG.add(g);if(sel&&sel.r==q.r&&sel.c==q.c)selG=g}))}
