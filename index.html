#hd{position:relative;display:flex;align-items:center;gap:6px;width:calc(100% - 16px);max-width:544px;min-height:38px;margin:calc(env(safe-area-inset-top,0px) + 7px) 0 4px;z-index:5}
#hd #st{flex:1;min-width:0;max-width:none;margin:0;padding:5px 8px;font-size:12px;line-height:1.25;text-align:center}
#hx{position:relative;flex:none}
#hxBtn{width:38px;height:38px;padding:0;border-radius:50%;border:2px solid #f4d58b;background:linear-gradient(180deg,#a45b27,#673414);color:#fff0c8;font-size:17px;line-height:1;box-shadow:0 2px 0 #2a1509}
#hxBody{position:absolute;right:0;top:calc(100% + 6px);width:min(270px,calc(100vw - 20px));max-height:46vh;overflow:auto;z-index:30;padding:8px 10px;border:2px solid #c99e52;border-radius:12px;background:linear-gradient(145deg,#392515fa,#170e09fa);color:#f1dfbd;font-size:11px;line-height:1.35;box-shadow:0 8px 20px #000c}
#hxBody[hidden]{display:none}

#hxBody .he:first-child{border:0;margin:0;padding:0}
#hxBody .he strong{color:#ffdc83}
#hxBody .he span{display:block;margin-top:2px}
.lgs{flex:none;display:flex;align-items:center;gap:5px;width:calc(100% - 16px);max-width:544px;min-height:40px;padding:4px 6px;border:2px solid #c89c51;border-radius:13px;background:linear-gradient(145deg,#382414f5,#170e09f5);box-shadow:inset 0 0 0 2px #f4d88b22,0 3px 8px #000a;color:#f6e4bc}
.lgs.act{border-color:#ffe18a;box-shadow:inset 0 0 0 2px #ffe18a55,0 0 14px #ffdc6d99,0 3px 8px #000a}
.lgs .lh{flex:none;min-width:52px;padding-right:6px;border-right:1px solid #e5c47b55;text-align:left;font-size:11px;line-height:1.25}
.lgs .lr{flex:1;min-width:0;display:flex;align-items:center;gap:3px}
.lgs .tk{width:24px;height:24px}
.lgs .lv{flex:1;min-width:0}
.lgs .bar2{height:6px;margin:0 0 2px}
.lgs .lv small{display:block;font-size:9px;line-height:1;white-space:nowrap}
#cv{flex:1 1 0;min-height:0;width:100%}
#ab{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:calc(100% - 16px);max-width:544px;min-height:0;padding:4px 0 calc(8px + env(safe-area-inset-bottom,0px))}
#abl{display:contents}
#ab .abtn{flex-direction:column;justify-content:center;gap:1px;min-width:0;min-height:46px;padding:3px 2px;border-radius:12px;font-size:11px}
#ab .abtn .tk{width:24px;height:24px}
#ab #et{grid-column:6;grid-row:1;min-width:0;min-height:46px;margin:0;padding:3px 2px;font:700 11px/1.15 Georgia,serif;border-radius:12px!important}

.hc{max-width:360px;width:100%;gap:12px}
.hi{font-size:44px}
.hc h3{font-size:24px}
.hb{width:100%;font-size:15.5px;line-height:1.45;text-align:left}
.hb2{font-size:15.5px;line-height:1.5;margin-top:10px}
.hl{display:flex;flex-direction:column;gap:11px;text-align:left}

.hz .hl>div{font-size:13.5px}
.hc .mb{min-width:170px}
.mb.sec{background:#ffffff26!important;border-color:#ffffff66!important;box-shadow:none!important}

.tp{animation:tpp 1s ease-in-out infinite alternate}
@keyframes tpp{to{box-shadow:0 0 0 3px #ffd23a,0 0 16px #ffd23a}}
