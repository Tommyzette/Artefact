#o,#dr{background:radial-gradient(ellipse at center,#634326f7,#170e09fa);color:#ffedc6}
#o button{border:2px solid #f4d58b;background:linear-gradient(#a45b27,#673414);color:#fff0c8;box-shadow:0 3px 0 #2a1509}
.dt,.tm h4{color:#ffe09a;text-shadow:0 2px 4px #000}
.tm{border:2px solid #bd914a;background:linear-gradient(145deg,#4a301b,#1d120b);box-shadow:inset 0 0 0 2px #f4d88b22,0 4px 12px #0008}
.dc{border:2px solid #b98a42;background:linear-gradient(145deg,#4a301b,#21150d);color:#f7e9c9}
.dc.on{border-color:#ffe18a;background:#92703955}
@media(max-width:520px){
 #hist{right:76px;top:10px;width:112px;max-height:155px}
 #hist.collapsed{width:102px;max-height:34px}
 #histbody{max-height:112px}
 #lg1{left:9px}#lg2{right:9px}
 #st{font-size:12px;padding:6px 10px}
 .abtn{font-size:11px;min-height:35px}
}


/* ===== Layout v2: nessuna legenda sopra al campo =====
   Nero in striscia sopra, Bianco in striscia sotto, cronologia a tendina nella barra in alto,
   Fine turno nella barra delle abilità. Il campo occupa tutto lo spazio che resta. */
body{overflow:hidden}
#hd{position:relative;display:flex;align-items:center;gap:6px;width:calc(100% - 16px);max-width:544px;min-height:38px;margin:calc(env(safe-area-inset-top,0px) + 7px) 0 4px;z-index:5}
#hd #st{flex:1;min-width:0;max-width:none;margin:0;padding:5px 8px;font-size:12px;line-height:1.25;text-align:center}
#hx{position:relative;flex:none}
#hxBtn{width:38px;height:38px;padding:0;border-radius:50%;border:2px solid #f4d58b;background:linear-gradient(180deg,#a45b27,#673414);color:#fff0c8;font-size:17px;line-height:1;box-shadow:0 2px 0 #2a1509}
#hxBody{position:absolute;right:0;top:calc(100% + 6px);width:min(270px,calc(100vw - 20px));max-height:46vh;overflow:auto;z-index:30;padding:8px 10px;border:2px solid #c99e52;border-radius:12px;background:linear-gradient(145deg,#392515fa,#170e09fa);color:#f1dfbd;font-size:11px;line-height:1.35;box-shadow:0 8px 20px #000c}
#hxBody[hidden]{display:none}
#hxBody .he{border-top:1px solid #e5c47b55;margin-top:5px;padding-top:5px}
#hxBody .he:first-child{border:0;margin:0;padding:0}
#hxBody .he strong{color:#ffdc83}
#hxBody .he span{display:block;margin-top:2px}
.lgs{flex:none;display:flex;align-items:center;gap:5px;width:calc(100% - 16px);max-width:544px;min-height:40px;padding:4px 6px;border:2px solid #c89c51;border-radius:13px;background:linear-gradient(145deg,#382414f5,#170e09f5);box-shadow:inset 0 0 0 2px #f4d88b22,0 3px 8px #000a;color:#f6e4bc}
.lgs.act{border-color:#ffe18a;box-shadow:inset 0 0 0 2px #ffe18a55,0 0 14px #ffdc6d99,0 3px 8px #000a}
.lgs .lh{flex:none;min-width:52px;padding-right:6px;border-right:1px solid #e5c47b55;text-align:left;font-size:11px;line-height:1.25}
.lgs .lr{flex:1;min-width:0;display:flex;align-items:center;gap:3px}
.lgs .tk{width:24px;height:24px}
.lgs .lv{flex:1;min-width:0}
.lgs .bar2{height:6px;margin:0 0 2px}
.lgs .lv small{display:block;font-size:9px;line-height:1;white-space:nowrap}
#cv{flex:1 1 0;min-height:0;width:100%}
#ab{flex:none;display:grid;grid-template-columns:repeat(6,1fr);gap:5px;width:calc(100% - 16px);max-width:544px;min-height:0;padding:4px 0 calc(8px + env(safe-area-inset-bottom,0px))}
#abl{display:contents}
#ab .abtn{flex-direction:column;justify-content:center;gap:1px;min-width:0;min-height:46px;padding:3px 2px;border-radius:12px;font-size:11px}
#ab .abtn .tk{width:24px;height:24px}
#ab #et{grid-column:6;grid-row:1;min-width:0;min-height:46px;margin:0;padding:3px 2px;font:700 11px/1.15 Georgia,serif;border-radius:12px!important}

/* ===== Slide iniziali e tutorial ===== */
.hc{max-width:360px;width:100%;gap:12px}
.hi{font-size:44px}
.hc h3{font-size:24px}
.hb{width:100%;font-size:15.5px;line-height:1.45;text-align:left}
.hb2{font-size:15.5px;line-height:1.5;margin-top:10px}
.hl{display:flex;flex-direction:column;gap:11px;text-align:left}
.hl>div{display:flex;gap:10px;align-items:center;font-size:15.5px;line-height:1.4}
.hl i{flex:none;width:34px;text-align:center;font-style:normal;font-size:25px;line-height:1;color:#ffd77a;font-weight:700}
.hz{display:flex;gap:12px;align-items:center;text-align:left}
.hz .hl>div{font-size:13.5px}
.hc .mb{min-width:170px}
.mb.sec{background:#ffffff26!important;border-color:#ffffff66!important;box-shadow:none!important}
#tut{flex:none;width:calc(100% - 16px);max-width:544px;margin:4px 0 2px;padding:8px 11px;border:2px solid #ffd77a;border-radius:13px;background:linear-gradient(145deg,#4a3216fa,#1d120bfa);color:#ffedc6;font-size:12.5px;line-height:1.4;box-shadow:0 0 14px #ffd77a55}
#tut[hidden]{display:none}
#tut .tt{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;color:#ffd77a;font-size:13px}
#tut .tt a{font-size:11px;opacity:.75;text-decoration:underline}
#tut .tb{display:flex;gap:8px;justify-content:center;margin-top:7px}
#tut .tb .mb{min-width:0;padding:6px 18px;font-size:13px}
.tp{animation:tpp 1s ease-in-out infinite alternate}
@keyframes tpp{to{box-shadow:0 0 0 3px #ffd23a,0 0 16px #ffd23a}}

/* contatore di rientro e stella usata nella legenda */
.lgs .tk{position:relative}
.lgs .tk .rc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);min-width:20px;padding:0 3px;border-radius:7px;background:#000c;color:#ffd77a;font-size:9px;font-weight:700;line-height:14px;text-align:center;white-space:nowrap;z-index:2}
.lgs .tk .us{position:absolute;right:-3px;bottom:-4px;font-style:normal;font-size:9px;line-height:1;color:#ffd77a;text-decoration:line-through;text-shadow:0 0 2px #000}
.lgs .lr.dead{opacity:.8;filter:none}.lgs .lr.dead .tk svg{opacity:.3}

/* ===== Schede ===== */
#tip{padding:12px;overflow:auto}
.cw{--fc:#e0a030;width:min(100%,380px);max-height:100%;overflow:auto;background:linear-gradient(160deg,#2a1c3f,#150f26);border:2px solid #c9a24a;border-radius:16px;box-shadow:0 0 0 2px #0008,0 6px 24px #000a;padding:12px;color:#f3ead2;text-align:left;font-size:13px;line-height:1.4;display:block}
.cw .ch{display:flex;gap:12px;align-items:center}
.cw .pt{width:92px;height:92px;flex:none;border-radius:14px;border:2px solid var(--fc);box-shadow:0 0 10px #0009}
.cw h3{margin:0 0 4px;font-size:21px;color:#ffd77a;font-family:Georgia,serif}
.cw .cc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.cw .fm,.cw .ro{font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;font-style:normal}
.cw .fm{color:#1a1208;opacity:1;border:0;margin:0}.cw .ro{background:#ffffff1e;border:1px solid #ffd77a88;color:#ffd77a}
.cw p{margin:0;font-size:12.5px}.cw small{display:block;opacity:.75;font-size:10.5px}
.cw .ci small{margin-top:3px}
.cst{margin-top:8px;padding:4px 8px;border-radius:8px;background:#b07cff33;font-size:12px;font-weight:700}
.cs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cs div{background:#ffffff12;border-radius:12px;padding:6px 8px;text-align:center}
.cs span{display:block;font-size:11px;opacity:.85}.cs strong{display:block;font-size:24px;line-height:1.1;font-family:Georgia,serif}
.cs div:first-child strong{color:#ff8a9a}.cs div:last-child strong{color:#7cc0ff}
.cr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cr>div{background:#ffffff0d;border-radius:12px;padding:8px;text-align:center}
.cr b{display:block;font-size:12px;margin-top:5px}
.mg{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;width:100px;margin:0 auto;aspect-ratio:1;background:#0b0a1a;padding:2px;border-radius:6px}
.mg i{background:#ffffff14;border-radius:1px;display:block}
.mg i.me{background:#fff;border-radius:50%}
.cl{font-size:10.5px;opacity:.7;margin-top:4px;text-align:center}
.cp{margin-top:8px;padding:8px 10px;border-radius:12px;font-size:12.5px;line-height:1.4}
.cp b{display:block;margin-bottom:2px;font-size:12px}.cp b em{font-weight:400;opacity:.85}
.cp.pw{background:#8e5bff26;border:1px solid #8e5bff77}.cp.pw b{color:#d9b0ff}
.cp.im{background:#ff8a3a22;border:1px solid #ff8a3a77}.cp.im b{color:#ffb070}
.cy{margin-top:8px;font-size:12px;opacity:.9}
#cb{flex:none;width:calc(100% - 16px);max-width:544px;margin:0 0 calc(4px + env(safe-area-inset-bottom,0px));min-height:34px;border:1px solid #c9a24a99;border-radius:12px;background:#ffffff12;color:#ffd77a;font:700 13px system-ui;letter-spacing:.3px}
#cs{position:fixed;left:0;right:0;bottom:0;z-index:4;flex-direction:column;background:#120f26f2;border-top:2px solid #c9a24a;border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #000a;height:min(58dvh,470px);padding-bottom:env(safe-area-inset-bottom,0px);align-items:center;display:none}
#cs.m .csel{flex-wrap:wrap;overflow:visible}#cs.m .cbar{align-items:flex-start}#cs.m{inset:0;height:auto;z-index:7;border-radius:0;background:var(--bg)}
.cbar{display:flex;gap:8px;align-items:center;width:100%;max-width:420px;padding:8px 10px 4px}
.csel{display:flex;gap:6px;overflow-x:auto;flex:1;padding:3px 2px}
.csel button{flex:none;width:44px;height:44px;padding:0;border-radius:12px;border:2px solid #ffffff33;background:none;opacity:.7}
.csel button svg{width:100%;height:100%;border-radius:10px}
.csel button.on{border-color:#ffd77a;opacity:1;box-shadow:0 0 8px #ffd77a99}
.csel button.o1{border-bottom:4px solid #fff}.csel button.o2{border-bottom:4px solid #111;box-shadow:0 1px 0 #fff6}
.cx{flex:none;font-size:12px;padding:8px 10px;border-radius:10px;border:1px solid #c9a24a;background:#ffffff14;color:#ffd77a}
.cbody{flex:1;min-height:0;width:100%;max-width:420px;overflow:auto;padding:4px 10px 12px}
#cs .cw{width:100%;max-height:none}
.cf{font-size:12px;color:#ffd77a;text-align:center;padding:2px 0 8px}
#ab .pp{grid-column:1/-1;grid-row:2;min-height:40px;flex-direction:row;font-size:12px;color:#ffe9a0;border-color:#ffd23a;background:#ffd23a22}

.ti{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 16%;display:block;pointer-events:none}
.tk{padding:2px;box-sizing:border-box}
.dc .ti{width:38px;height:38px;flex:none;border:2px solid #c9a24a;box-sizing:border-box}
.lgs .lr.dead .tk .ti{opacity:.35}
.cw .pt{width:100px;height:auto;flex:none;border:0;box-shadow:none;border-radius:0;filter:drop-shadow(0 3px 6px #000a)}
.cw .ch{align-items:flex-start}
.csel button img{width:100%;height:100%;border-radius:10px;object-fit:cover;object-position:50% 12%;display:block}

const NF=23,RCH={},MVT={};Object.keys(CH).forEach(k=>{const d=CH[k];MVT[k]=Math.max(d.mv[0],d.mv[1]);RCH[k]=MVT[k]+Math.max(d.ra[0],d.ra[1])});
const dCh=(a,b,c,d)=>Math.max(Math.abs(a-c),Math.abs(b-d));
/* pesi: 0 PV, 1 pezzi, 2 attacco, 3 esposizione, 4 rischio morte, 5 occasioni, 6 uccisioni possibili, 7 isolamento, 8 formazione,
   9 avanzata, 10 avanzata sostenuta, 11 avanzata di squadra, 12 minaccia alla mia ★, 13 occasione sulla ★ nemica, 14 guardia, 15 distanza nemici dalla mia ★,
   16 controllo quadrati, 17 potere, 18 corsa ai 25, 19 impeto, 20 zona d'attacco, 21 artefatti minori, 22 presenza in battaglia, 23 bonus uccisione, 24 bonus artefatto minore, 25 rumore */
const NW0=[0.894,0.852,1.446,-0.213,0.153,0.728,0.8,-0.149,0.534,3.858,2.302,-0.371,-3.225,1.097,3.16,0.447,4.019,3.029,1.206,0.913,0.964,0.198,2.355,0.795,6.306,0.05];
const NWT={E:[0.899, 0.361, 0.308, -0.199, -0.407, 0.194, 1.969, -0.498, 0.169, 9.308, 1.753, -0.102, -2.48, 0.493, 3.794, 0.014, 1.995, 2.716, 4.404, 1.89, 0.322, 0.763, 0.726, 0.51, 0.418, 0.05],B:[5.0, 0.359, 0.737, -0.297, 0.423, 0.394, 1.208, -0.026, 0.477, 1.999, 1.793, -0.049, -0.557, 5.537, 4.211, 1.066, 2.184, 2.648, 1.06, -0.053, 2.086, -0.033, 0.793, 0.88, 6.337, 0.05]};
let NWs={1:NW0,2:NW0};
function evalS(p,w){const o=p==1?2:1,P=pcs(p),Q=pcs(o),EA=ART[o],HA=ART[p],ag=1+tc/80;
 let hpP=0,hpQ=0,atP=0,atQ=0;for(const q of P){hpP+=q.hp;atP+=atk(q)}for(const e of Q){hpQ+=e.hp;atQ+=atk(e)}
 let s=w[0]*(hpP-hpQ)/10+w[1]*(P.length-Q.length)+w[2]*(atP-atQ)/5;
 let ex=0,kr=0,iso=0,pairs=0,adv=0,lead=99,leadQ=null;
 for(const q of P){let T=0;for(const e of Q)if(dCh(q.r,q.c,e.r,e.c)<=RCH[e.t])T+=atk(e);
  ex+=Math.min(T,q.hp)/Math.max(q.hp,4);if(T>=q.hp)kr++;
  let dn=99;for(const a of P)if(a!==q){const d=dCh(q.r,q.c,a.r,a.c);if(d<dn)dn=d;if(d<=2)pairs++}
  if(P.length>1&&dn>2)iso+=T>0?2:1;
  const d=dCh(q.r,q.c,EA[0],EA[1]);adv+=1-d/12;if(d<lead){lead=d;leadQ=q}}
 pairs/=2;let op=0,kc=0;
 for(const e of Q){let T=0;for(const q of P)if(dCh(q.r,q.c,e.r,e.c)<=RCH[q.t])T+=atk(q);op+=Math.min(T,e.hp)/Math.max(e.hp,4);if(T>=e.hp)kc++}
 s+=w[3]*ex+w[4]*kr+w[5]*op+w[6]*kc+w[7]*iso+w[8]*pairs;
 if(P.length){const pr=Math.max(0,1-lead/12);let sup=0;for(const a of P)if(a!==leadQ&&dCh(a.r,a.c,leadQ.r,leadQ.c)<=3)sup++;sup=Math.min(sup,3);
  s+=ag*w[9]*pr+w[10]*pr*sup+w[11]*adv/P.length}
 const g=bd[HA[0]][HA[1]];let cap=0;
 if(!g){for(const e of Q)if(!USED[o][e.t]&&dCh(e.r,e.c,HA[0],HA[1])<=MVT[e.t])cap++}
 else if(g.p==p){let T=0;for(const e of Q)if(dCh(g.r,g.c,e.r,e.c)<=RCH[e.t])T+=atk(e);if(T>=g.hp)for(const e of Q)if(!USED[o][e.t]&&dCh(e.r,e.c,HA[0],HA[1])<=MVT[e.t])cap++}
 let mc=0;const ge=bd[EA[0]][EA[1]];
 if(!ge){for(const q of P)if(dCh(q.r,q.c,EA[0],EA[1])<=MVT[q.t])mc++}
 else if(ge.p==o){let T=0;for(const q of P)if(dCh(ge.r,ge.c,q.r,q.c)<=RCH[q.t])T+=atk(q);if(T>=ge.hp)for(const q of P)if(dCh(q.r,q.c,EA[0],EA[1])<=MVT[q.t])mc++}
 s+=ag*w[12]*Math.min(cap,2)+ag*w[13]*Math.min(mc,2)+w[14]*(g&&g.p==p?1:0);
 let dE=12;for(const e of Q){const d=dCh(e.r,e.c,HA[0],HA[1]);if(d<dE)dE=d}s+=w[15]*dE/12;
 const m=[0,0,0],n=[0,0,0];let bz=0;
 for(const q of P)if(q.r>=5&&q.r<=7){m[q.c<=2?0:q.c<=5?1:2]++;bz++}
 for(const e of Q)if(e.r>=5&&e.r<=7)n[e.c<=2?0:e.c<=5?1:2]++;
 let pc=0;for(let i=0;i<3;i++)pc+=(i==1?2:1)*(m[i]>n[i]?1:m[i]<n[i]?-1:0);
 s+=w[16]*pc+w[17]*(mana[p]-mana[o])/25+w[18]*((mana[p]/25)**2-(mana[o]/25)**2)+w[22]*bz/5;
 let oz=0,oz2=0;for(const q of P)if(p==1?q.r>=8:q.r<=4)oz++;for(const e of Q)if(o==1?e.r>=8:e.r<=4)oz2++;
 s+=w[19]*(imp[p]-imp[o])/20+w[20]*(oz-oz2)/5;
 let mp=0;for(const mm of MA)if(!mm.done&&mm.p==p)for(const q of P){const d=1-dCh(q.r,q.c,mm.r,mm.c)/12;if(d>mp)mp=d}
 return s+w[21]*mp}
function ai3Pick(p){const o=p==1?2:1,w=NWs[p],EA=ART[o];let best=null,bs=-1e18;
 for(const q of pcs(p)){const r0=q.r,c0=q.c;
  if(mvL>0&&canMv(q)){for(const [a,b] of rawMv(r0,c0)){if(a==EA[0]&&b==EA[1])return{r:r0,c:c0,a,b};
    bd[r0][c0]=null;q.r=a;q.c=b;bd[a][b]=q;let sc=evalS(p,w);if(MA.some(m=>!m.done&&m.p==p&&m.r==a&&m.c==b))sc+=w[24];
    bd[a][b]=null;q.r=r0;q.c=c0;bd[r0][c0]=q;sc+=Math.random()*w[25];if(sc>bs){bs=sc;best={r:r0,c:c0,a,b}}}}
  if(atL>0&&canAt(q)){for(const [a,b] of rawAt(r0,c0)){const x=bd[a][b],d=x.sh?0:Math.max(1,atk(q)-armor(x)),sh=x.sh;
    x.hp-=d;const kill=x.hp<=0;if(kill)bd[a][b]=null;let sc=evalS(p,w);if(kill)sc+=w[23];
    x.hp+=d;if(kill)bd[a][b]=x;x.sh=sh;sc+=Math.random()*w[25];if(sc>bs){bs=sc;best={r:r0,c:c0,a,b}}}}}
 return best}

const portrait=t=>'<img class="pt" alt="'+CH[t].n+'" draggable="false" src="'+FRI[t]+'">';const rng=(a,tri)=>{if(tri)return"tridente: 4 in linea retta + le caselle accanto alla 2ª e 3ª · colpisce tutti i nemici nell’area";const s=[];if(a[0])s.push(a[0]+" in linea retta");if(a[1])s.push(a[1]+" in diagonale");return s.length?s.join(" · "):"nessuna"};
function mini(a,col,tri){let h='<div class="mg">';const T=new Set;if(tri)O4.forEach(([dr,dc])=>{for(let i=1;i<=4;i++)T.add(dr*i+","+dc*i);for(let i=2;i<=3;i++){T.add((dr*i+dc)+","+(dc*i+dr));T.add((dr*i-dc)+","+(dc*i-dr))}});
 for(let r=-4;r<=4;r++)for(let c=-4;c<=4;c++){const o=!r||!c,d=Math.abs(r)==Math.abs(c),n=Math.max(Math.abs(r),Math.abs(c));
 const on=tri?T.has(r+","+c):(r||c)&&((o&&n<=a[0])||(d&&n<=a[1]));h+='<i'+(!r&&!c?' class="me"':on?' style="background:'+col+'"':'')+'></i>'}return h+'</div>'}
function cardHTML(t,q,pp){const d=CH[t],x=CX[t],P=q?q.p:pp,fc=FC[d.f],pc=potCost(t);
